<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Touchline Admin</title><style>body{font-family:system-ui;background:#0b1d2e;color:#f1f6fc;margin:0;min-height:100vh;display:grid;place-items:center}.card{max-width:410px;width:calc(100% - 40px);background:#152d44;padding:26px;border:1px solid #385a72;border-radius:18px;box-sizing:border-box}h1{letter-spacing:-1px}.sub{color:#bbd0e2;font-size:14px;line-height:1.6}label{display:block;margin:18px 0 6px;font-weight:700}input{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;border:1px solid #50708b;background:#0a1e2d;color:white;font-size:15px}.actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}button{border:1px solid #6a8d9c;border-radius:10px;padding:12px;cursor:pointer;font-weight:800;background:#c9fa67;color:#0c241b;flex:1}button.secondary{background:#233f5b;color:white}.result{min-height:30px;padding-top:12px;color:#c9fa67;font-size:13px;line-height:1.6}.notice{font-size:12px;color:#b7d3e3;margin-top:14px;line-height:1.6}</style><div class="card"><div style="font-size:12px;letter-spacing:2px;color:#c9fa67;font-weight:900">PRIVATE CONTROL PANEL</div><h1>Touchline Admin</h1><p class="sub">Turn the Top 10 Pickups tab on or off for all league members. The public leaderboard and transfers remain visible.</p><label for="pass">Admin password</label><input id="pass" type="password" autocomplete="off" placeholder="Enter the Render admin password"><div class="actions"><button id="on">Show Top 10</button><button class="secondary" id="off">Hide Top 10</button></div><div class="actions"><button class="secondary" id="status">Check current setting</button></div><div class="result" id="msg" aria-live="polite"></div><p class="notice">Keep this password private. GitHub persistence is optional; without it, Render can reset the setting after restarting.</p></div><script>const msg=document.getElementById('msg'),pass=document.getElementById('pass');async function send(path,enabled){msg.textContent='Saving…';try{const req={password:pass.value};if(typeof enabled==='boolean')req.enabled=enabled;const res=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(req),cache:'no-store'});const v=await res.json();if(!res.ok)throw Error(v.error||'Request failed');msg.textContent='Top 10 Pickups: '+(v.enabled?'VISIBLE':'HIDDEN')+(v.durable===false?' · Temporary until Render restarts':'');}catch(e){msg.textContent=e.message}}document.getElementById('on').onclick=()=>send('/api/admin/feature',true);document.getElementById('off').onclick=()=>send('/api/admin/feature',false);document.getElementById('status').onclick=()=>send('/api/admin/status');</script></html>
